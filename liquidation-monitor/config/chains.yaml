# Chain registry.
#
# RPC endpoints can be overridden per chain with a comma-separated env var:
#   LIQMON_RPC_BSC=http://127.0.0.1:8545,https://bsc-rpc.publicnode.com
#   LIQMON_RPC_AVALANCHE=http://127.0.0.1:9650/ext/bc/C/rpc
# The first endpoint is preferred; the rest are failover targets.
#
# Public endpoints listed here were reachable when this file was written.
# They are NOT archive nodes and they cap eth_getLogs ranges, so a full
# historical backfill needs your own node (see docs/ARCHITECTURE.md).

bsc:
  chain_id: 56
  name: BNB Smart Chain
  native_symbol: BNB
  wrapped_native: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"   # WBNB
  multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"         # verified: code present
  rpc_urls:
    - https://bsc-rpc.publicnode.com
    - https://bsc-dataseed.bnbchain.org
    - https://1rpc.io/bnb
  # Blocks to stay behind head when indexing logs (reorg safety).
  confirmations: 15
  # How far back the indexer re-checks block hashes to detect reorgs.
  reorg_depth: 64
  # Max block span per eth_getLogs call; the indexer halves it on "range too large".
  max_log_range: 5000
  # Client-side rate limit per endpoint (requests/second).
  requests_per_second: 20
  # Batch sizes.
  multicall_chunk: 150
  rpc_batch_size: 25

avalanche:
  chain_id: 43114
  name: Avalanche C-Chain
  native_symbol: AVAX
  wrapped_native: "0xB31f66AA3C1e785363F0875A1B74E27b85FD66c7"   # WAVAX
  multicall3: "0xcA11bde05977b3631167028862bE2a173976CA11"         # verified: code present
  rpc_urls:
    - https://api.avax.network/ext/bc/C/rpc
    - https://avalanche-c-chain-rpc.publicnode.com
  confirmations: 2          # Snowman consensus gives fast finality
  reorg_depth: 16
  max_log_range: 2048       # api.avax.network hard limit
  requests_per_second: 15
  multicall_chunk: 150
  rpc_batch_size: 25
