[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liqmon"
version = "0.1.0"
description = "Local liquidation monitoring and fork-simulation research system for BSC and Avalanche C-Chain"
requires-python = ">=3.11"
dependencies = [
  "eth-abi>=5",
  "eth-utils>=4",
  "eth-hash[pycryptodome]>=0.7",
  "eth-account>=0.13",
  "httpx>=0.27",
  "rich>=13",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
liqmon = "liqmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liqmon = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "network: requires public RPC access",
  "fork: requires anvil and public RPC access",
]
addopts = "-m 'not network and not fork'"
